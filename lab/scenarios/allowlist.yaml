# LAB ONLY: allowed technique and control IDs for scenario manifests (spec 001 AC-2).
techniques:
  # OWASP Top 10 for Agentic Applications (Dec 2025)
  owasp_agentic: [ASI01, ASI02, ASI03, ASI04, ASI05, ASI06, ASI07, ASI08, ASI09, ASI10]
  # OWASP Top 10 for LLM Applications 2026
  owasp_llm: [LLM01, LLM02, LLM03, LLM04, LLM05, LLM06, LLM07, LLM08, LLM09, LLM10]
  # MITRE ATLAS IDs used in DESIGN.md §7.3
  atlas: [AML.T0010, AML.T0011.002, AML.T0051.001, AML.T0086]
controls:
  exact:
    - pin:unapproved
    - pin:changed
    - pin:duplicate_name
    - pin:recheck_pending
    - pin:recheck_failed
    - mrtr:unsolicited_response
    - mrtr:unmatched_retry
    - policy:default-deny
  analyzers: [unicode.hidden, text.imperative, text.cross_reference, schema.side_channel]
  secrets: [aws-access-key, github-token, slack-token, google-api-key, stripe-live-key, private-key, jwt]
