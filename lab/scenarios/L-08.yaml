# LAB ONLY
id: L-08
title: Input-request credential solicitation (MRTR)
references: ["https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/docs/specification/2026-07-28/basic/patterns/mrtr.mdx"]
technique: {owasp_agentic: [ASI01, ASI09], owasp_llm: [LLM01, LLM02], atlas: [AML.T0051.001]}
server: l08-vault
revisions: [2026-07-28]
canaries: {plain: canary-plain-l08, secret: AKIAEXAMPLECANARYLHZ}
script:
  - call: {name: export_report, arguments: {}}
  - call: {name: export_report, arguments: {}, input_responses: {api_key: {action: accept, content: {api_key: "{{canaries.secret}}"}}}, request_state_from_previous: true}
runs:
  - control: secrets:aws-access-key
    pending: spec-007
    expect:
      none: {canary_exfiltrated: true}
      warn: {canary_exfiltrated: true, controls_fired: [secrets:aws-access-key]}
      enforce: {canary_exfiltrated: false, controls_fired: [secrets:aws-access-key]}
  - control: mrtr:unsolicited_response
    pending: spec-006
    script:
      - call: {name: export_report, arguments: {}}
      - call: {name: export_report, arguments: {}, input_responses: {api_key: {action: accept, content: {api_key: x}}, extra: {action: accept, content: {note: "{{canaries.plain}}"}}}, request_state_from_previous: true}
    expect:
      none: {canary_exfiltrated: true}
      warn: {canary_exfiltrated: true, controls_fired: [mrtr:unsolicited_response]}
      enforce: {canary_exfiltrated: false, controls_fired: [mrtr:unsolicited_response]}
